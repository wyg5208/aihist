<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AI 纪年：记录人工智能的关键事件、大模型发布与重要研究。条目来自公开接口与官方公告，经去重与交叉验证入档。"
    />
    <meta name="theme-color" content="#f6f2e9" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Theme boot: runs before the module graph and before the first paint, so
      // the wrong palette never flashes. Kept in sync with `src/lib/theme.ts`
      // (same storage key, same two chrome colours, same system fallback).
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem("aihist.theme");
        } catch (error) {
          /* storage blocked: fall through to the system preference */
        }
        var theme =
          saved === "dark" || saved === "light"
            ? saved
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "dark" ? "#14120f" : "#f6f2e9");
      })();
    </script>
    <meta property="og:title" content="AI 纪年 · 人工智能发展编年史" />
    <meta
      property="og:description"
      content="从图灵测试到前沿智能体，按年份编排的 AI 档案，附来源、证据与置信度。"
    />
    <meta property="og:type" content="website" />
    <title>AI 纪年 · 人工智能发展编年史</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
