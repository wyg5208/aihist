# api.aihist.net：AI 纪年的 API 回源面。
#
# 这份文件是**本机实际在跑的那一份**，与 deploy/windows/Caddyfile.api 语义一致；
# 两者的区别只是边缘服务器的选择：本机用的是共享的 nginx 1.26（它同时服务
# ai-skill.pw / ai-edu.pw / erp.wyg.life / fina.wyg.life），所以这里只新增
# server block，绝不触碰任何既有站点。
#
# 安装（三处都必须对上，否则 502）：
#   1. 复制到 nginx：      Copy-Item .\deploy\windows\nginx-api.aihist.net.conf D:\nginx\conf\aihist-api.conf
#   2. 在 http{} 里 include，且必须放在 log_format main 定义**之后**：
#        include D:/nginx/conf/aihist-api.conf;
#      （放在前面会报 unknown log format "main"，因为 access_log 用了命名格式）
#   3. D:\nginx\nginx.exe -t && D:\nginx\nginx.exe -s reload
#
# 上游端口 8001：8000 留给本地 vite dev 的开发实例，二者读不同的数据库
# （dev 读 backend/aihist.db，生产读 D:\srv\aihist\data\aihist.db）。
# 端口由 deploy/windows/install-service.ps1 -Port 8001 决定，改动要两边同步。
#
# 证书：DNS-01（阿里云解析），certbot 证书名 api.aihist.net；部署钩子把证书装到
# D:/nginx/ssl/api.aihist.net/ 并 reload。续期由计划任务「SSL证书自动续期」
# 驱动，续期后无需手工搬运。

server {
    listen      80;
    listen      [::]:80;
    server_name api.aihist.net;

    return 301 https://$host$request_uri;
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name api.aihist.net;

    charset utf-8;

    # 这个文件就是 deploy/api.env 里 ANALYTICS_LOG_PATH 指向的那一个。
    # Vercel 回源时 $remote_addr 是边缘节点，真实客户端在 $http_x_forwarded_for
    # （后端的 --proxy-headers / --forwarded-allow-ips 127.0.0.1 才会采信它）。
    access_log  D:/srv/aihist/logs/access.api.log main;
    error_log   logs/api.aihist.net.error.log;

    ssl_certificate     D:/nginx/ssl/api.aihist.net/fullchain.pem;
    ssl_certificate_key D:/nginx/ssl/api.aihist.net/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:aihist_api:10m;
    ssl_session_timeout 1h;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 2m;

    location /api/ {
        proxy_pass         http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;

        # 管理台的读接口不允许任何一层缓存（Vercel 侧另有 CDN-Cache-Control）。
        add_header Cache-Control "no-store" always;
    }

    location /go/ {
        proxy_pass         http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
