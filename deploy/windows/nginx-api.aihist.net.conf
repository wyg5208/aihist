# api.aihist.net：AI 纪年的 API 回源面。
#
# 这份文件是**本机实际在跑的那一份**，与 deploy/windows/Caddyfile.api 语义一致；
# 两者的区别只是边缘服务器的选择：本机用的是共享的 nginx 1.26（它同时服务
# ai-skill.pw / ai-edu.pw / erp.wyg.life / fina.wyg.life），所以这里只新增
# server block，绝不触碰任何既有站点。
#
# 安装（三处都必须对上，否则 502）：
#   1. 复制到 nginx：      Copy-Item .\deploy\windows\nginx-api.aihist.net.conf D:\nginx\conf\aihist-api.conf
#   2. 在 http{} 里 include，且必须放在 log_format main 定义**之后**：
#        include D:/nginx/conf/aihist-api.conf;
#      （放在前面会报 unknown log format "main"，因为 access_log 用了命名格式）
#   3. D:\nginx\nginx.exe -t && D:\nginx\nginx.exe -s reload
#
# 上游端口 8001：8000 留给本地 vite dev 的开发实例，二者读不同的数据库
# （dev 读 backend/aihist.db，生产读 D:\srv\aihist\data\aihist.db）。
# 端口由 deploy/windows/install-service.ps1 -Port 8001 决定，改动要两边同步。
#
# 证书：DNS-01（阿里云解析），certbot 证书名 api.aihist.net；部署钩子把证书装到
# D:/nginx/ssl/api.aihist.net/ 并 reload。续期由计划任务「SSL证书自动续期」
# 驱动，续期后无需手工搬运。

# 公开读接口的源站缓存。三个路径的数据一天只变一次，60 秒的新鲜度换掉每次
# 首屏都打一次 SQLite + 序列化的开销；Vercel 边缘还会在前面再拦一层。
# 目录要先建好：New-Item -ItemType Directory -Force D:\nginx\cache\aihist-reads
proxy_cache_path D:/nginx/cache/aihist-reads levels=1:2 keys_zone=aihist_reads:10m
                 max_size=128m inactive=10m use_temp_path=off;

server {
    listen      80;
    listen      [::]:80;
    server_name api.aihist.net;

    return 301 https://$host$request_uri;
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name api.aihist.net;

    charset utf-8;

    # 这个文件就是 deploy/api.env 里 ANALYTICS_LOG_PATH 指向的那一个。
    # Vercel 回源时 $remote_addr 是边缘节点，真实客户端在 $http_x_forwarded_for
    # （后端的 --proxy-headers / --forwarded-allow-ips 127.0.0.1 才会采信它）。
    access_log  D:/srv/aihist/logs/access.api.log main;
    error_log   logs/api.aihist.net.error.log;

    ssl_certificate     D:/nginx/ssl/api.aihist.net/fullchain.pem;
    ssl_certificate_key D:/nginx/ssl/api.aihist.net/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:aihist_api:10m;
    ssl_session_timeout 1h;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 2m;

    location /api/ {
        proxy_pass         http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;

        # 管理台的读接口不允许任何一层缓存（Vercel 侧另有 CDN-Cache-Control）。
        # 下面三个公开读接口用精确匹配单独放行，不受这一行影响。
        add_header Cache-Control "no-store" always;
    }

    # --- 公开读接口：可缓存 ------------------------------------------------
    # 精确匹配优先于上面的前缀，且只放这三个：`/timeline` 每次首屏都拉，
    # `/status` 每 5 分钟轮询一次，`/standard` 是静态文档。track / admin /
    # events / go 仍然走上面的 no-store。
    #
    # 这个块里的 add_header 会替换掉继承来的安全头，所以那两个要重写一遍。
    location = /api/v1/timeline {
        proxy_cache        aihist_reads;
        proxy_cache_valid  200 60s;
        proxy_cache_key    $scheme$host$request_uri;
        proxy_cache_lock   on;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_ignore_headers Set-Cookie;

        proxy_pass         http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;

        add_header Cache-Control "public, max-age=15, s-maxage=60, stale-while-revalidate=300" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location = /api/v1/status {
        proxy_cache        aihist_reads;
        proxy_cache_valid  200 60s;
        proxy_cache_key    $scheme$host$request_uri;
        proxy_cache_lock   on;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_ignore_headers Set-Cookie;

        proxy_pass         http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;

        add_header Cache-Control "public, max-age=15, s-maxage=60, stale-while-revalidate=300" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location = /api/v1/standard {
        proxy_cache        aihist_reads;
        proxy_cache_valid  200 1h;
        proxy_cache_key    $scheme$host$request_uri;
        proxy_cache_lock   on;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_ignore_headers Set-Cookie;

        proxy_pass         http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;

        add_header Cache-Control "public, max-age=3600, s-maxage=3600, stale-while-revalidate=86400" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location /go/ {
        proxy_pass         http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
