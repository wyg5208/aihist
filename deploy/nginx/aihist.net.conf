# /etc/nginx/sites-available/aihist.net
#
# One origin serves everything: no CORS, no SPA fallback. Every path below maps
# to a real file, so a typo 404s instead of rendering the timeline shell.
#
#   /                 -> dist/                     (Vite build, timeline + ?e= deep links)
#   /e/<slug>.html    -> dist/e/<slug>.html        (148 static citation pages)
#   /admin/           -> dist/admin.html           (console, noindex)
#   /api/             -> 127.0.0.1:8000            (uvicorn)
#   /go/<code>        -> 127.0.0.1:8000            (partner redirect, 302)

# Second line of defence for the beacon: the application keeps its own sliding
# window, but that window is per-process and dies with a restart. 60r/m is the
# same ceiling, so a well-behaved client never sees this one.
limit_req_zone $binary_remote_addr zone=track:10m rate=60r/m;

upstream aihist_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name aihist.net www.aihist.net;

    # Certbot needs this one plain-HTTP path; everything else is redirected.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://aihist.net$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.aihist.net;

    ssl_certificate     /etc/letsencrypt/live/aihist.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aihist.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    return 301 https://aihist.net$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name aihist.net;

    root /srv/aihist/dist;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/aihist.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aihist.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    charset utf-8;
    server_tokens off;
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    access_log /var/log/nginx/aihist.access.log;
    error_log  /var/log/nginx/aihist.error.log warn;

    # --- API ------------------------------------------------------------
    location /api/ {
        proxy_pass http://aihist_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Reads are cheap; the only slow call is the admin sync kick-off, which
        # returns 202 immediately. Keep the ceiling well above that.
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # The beacon is the one endpoint anyone on the internet can call in a loop.
    # The application answers 204 to everything, including a refusal, so the
    # only cost of a flood is the proxy pass itself — which this caps.
    location = /api/v1/track {
        limit_req zone=track burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://aihist_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        proxy_buffering off;
    }

    # --- Partner redirect -----------------------------------------------
    # A 302 to the partner's own site. Buffering stays off and no cache header
    # is added: the click is counted on the application side, and `add_header`
    # here would also replace the inherited security headers.
    location /go/ {
        proxy_pass http://aihist_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        proxy_buffering off;
    }

    # --- Admin console --------------------------------------------------
    # `add_header` in a location replaces the inherited set, so the security
    # headers above are repeated here rather than silently dropped.
    location = /admin {
        return 301 /admin/;
    }

    location = /admin/ {
        try_files /admin.html =404;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
    }

    location = /admin.html {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
    }

    # --- Hashed bundle --------------------------------------------------
    # `expires` sets Cache-Control itself and does not break header inheritance.
    location /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # --- Static citation pages -----------------------------------------
    location /e/ {
        expires 7d;
        try_files $uri $uri.html =404;
    }

    # --- Everything else ------------------------------------------------
    # $uri.html makes /e/<slug> work without the extension. There is no
    # `/index.html` fallback on purpose: a wrong path must 404, not serve the
    # timeline with a 200.
    location / {
        try_files $uri $uri.html =404;
    }

    location = /robots.txt {
        access_log off;
    }

    location = /sitemap.xml {
        expires 1h;
    }
}
