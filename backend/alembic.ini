[alembic]
# `%(here)s` keeps the paths anchored to this file, so `-c backend/alembic.ini`
# works from the repository root as well as from `backend/`.
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
version_path_separator = os

# The URL is resolved in `env.py` from `app.config.Settings` so that the
# environment variable `DATABASE_URL` stays the single source of truth.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
